@defer (on viewport; prefetch on idle) {

<div 
  class="mx-auto w-11/12 md:w-10/12 lg:w-8/12 
         p-6 md:p-8 
         bg-white/5 backdrop-blur-lg border border-white/10 
         rounded-2xl shadow-xl 
         animate__animated animate__fadeInDown 
         overflow-hidden"
>

  <div class="absolute w-40 h-40 bg-blue-500 opacity-10 blur-3xl rounded-full top-0 right-0 pointer-events-none"></div>

  <div class="flex flex-col md:flex-row gap-6">

    <div class="w-full md:w-1/2 flex flex-col text-start">

      <p class="text-blue-400 text-sm">
        {{ projectNumber }}
      </p>

      <h4 class="text-white text-2xl md:text-3xl font-semibold mt-1">
        {{ title }}
      </h4>

    </div>

    <div class="w-full md:w-1/2 flex flex-col">

      <div class="flex flex-wrap gap-2 justify-start md:justify-end">

        <button
          class="px-5 py-1 rounded-full 
                 bg-blue-600 hover:bg-blue-500 
                 text-white text-sm transition"
        >
          {{ btnTxt }}
        </button>

        <button
          class="px-5 py-1 rounded-full 
                 bg-white/10 hover:bg-white/20 
                 text-white text-sm transition"
        >
          {{ btnTxt2 }}
        </button>

      </div>

      <p class="text-gray-300 text-sm md:text-base mt-3 text-start md:text-right break-words">
        {{ description }}
      </p>

    </div>

  </div>

  <div class="w-full mt-6 flex justify-center">

    <a href="{{ link }}" target="_blank" class="block w-full">

      <img
        src="{{ imgPath }}"
        class="w-full md:w-[80%] mx-auto 
               rounded-xl 
               transition duration-300 
               hover:scale-[1.02] hover:brightness-75"
        alt=""
      />

    </a>

  </div>

</div>

} @placeholder {
  <p class="text-center text-gray-400">Loading project...</p>
}
