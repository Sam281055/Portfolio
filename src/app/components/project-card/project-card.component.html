@defer (on viewport; prefetch on idle) {
  <div
    class="mx-auto w-10/12 md:w-full bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl shadow-xl animate__animated animate__fadeInDown overflow-hidden"
  >
    <!-- Imagen tipo HERO -->
    <a href="{{ link }}" target="_blank" class="block">
      <img
        src="{{ imgPath }}"
        class="w-full h-[220px] md:h-[280px] object-cover transition duration-300 hover:brightness-75"
        alt=""
      />
    </a>

    <!-- Contenido -->
    <div class="p-6 md:p-8 flex flex-col gap-4">
      <div>
        <p class="text-gray-400 text-sm">
          {{ projectNumber }}
        </p>

        <h4 class="text-white text-xl md:text-2xl font-semibold mt-1">
          {{ title }}
        </h4>
      </div>

      <p class="text-gray-300 text-sm md:text-base leading-relaxed">
        {{ description }}
      </p>

      <!-- Botón -->
      <div>
        <a href="{{ link }}" target="_blank">
          <button
            class="px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-sm transition flex items-center gap-2"
          >
            {{ btnTxt }}
            →
          </button>
        </a>
      </div>
    </div>
  </div>
} @placeholder {
  <p class="text-center text-gray-400">Loading project...</p>
}
