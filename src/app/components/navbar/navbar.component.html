<!-- DESKTOP NAVBAR -->
<div class="hidden lg:flex w-10/12 mx-auto 
            px-6 py-5 
            bg-white/5 backdrop-blur-lg border border-white/10 
            rounded-xl shadow-lg">

  <!-- Logo -->
  <div
    class="w-auto sm:w-1/2 flex items-center gap-3 text-white hover:opacity-80 transition"
  >
  <button (click)="navigate('/work')" class="flex">
    <img src="/LOGO.png" class="w-12 h-12 drop-shadow-md" alt="" />
    <h1 class="font-semibold text-lg tracking-wide my-auto">
      Sam281055
    </h1>
    </button>
  </div>

  <!-- Menu -->
  <div class="w-1/2 flex justify-end items-center gap-6">

    <ng-container *ngFor="let item of Items">
      <button
        (click)="navigate(item.rout)"
        class="text-blue-200 hover:text-white transition font-medium"
      >
        {{ item.title }}
      </button>
    </ng-container>

    <!-- Resume -->
    <a
      target="_blank"
      [href]="resumeLink"
      class="px-4 py-1 rounded-lg 
             bg-blue-600 hover:bg-blue-500 
             text-white font-medium transition shadow"
    >
      {{ resumeText }}
    </a>

    <!-- Language -->
    <app-language-selector
      class="ml-2"
      [language]="language"
    ></app-language-selector>

  </div>
</div>


<!-- MOBILE NAVBAR -->
<div class="w-full flex lg:hidden px-4 py-3 
            bg-white/5 backdrop-blur-lg border-b border-white/10">

  <div class="w-1/2 flex items-center gap-3 text-white">
    <img src="/LOGO.png" class="w-10 h-10" alt="" />
    <h1 class="font-semibold text-base">
      Sam281055
    </h1>
  </div>

  <div class="w-1/2 flex justify-end items-center">
    <button 
      (click)="toggleModal()" 
      class="p-2 rounded-lg hover:bg-white/10 transition text-white"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>
  </div>
</div>


<!-- MOBILE MODAL -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 lg:hidden"
  (click)="toggleModal()"
>

  <div
    class="bg-slate-900 text-white w-11/12 max-w-lg rounded-xl 
           border border-white/10 shadow-2xl p-6"
    (click)="$event.stopPropagation()"
  >

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold">Menu</h2>
      <button 
        (click)="toggleModal()" 
        class="text-gray-400 hover:text-white transition"
      >
        ✖
      </button>
    </div>

    <!-- Items -->
    <div class="flex flex-col gap-4">

      <ng-container *ngFor="let item of Items">
        <button
          (click)="navigate(item.rout)"
          class="text-lg text-blue-200 hover:text-white transition text-left"
        >
          {{ item.title }}
        </button>
      </ng-container>

      <!-- Resume -->
      <a
        target="_blank"
        [href]="resumeLink"
        (click)="toggleModal()"
        class="mt-2 px-4 py-2 rounded-lg 
               bg-blue-600 hover:bg-blue-500 
               text-white text-center transition"
      >
        {{ resumeText }}
      </a>

      <!-- Language -->
      <app-language-selector
        class="mt-4"
        [language]="language"
      ></app-language-selector>

    </div>
  </div>
</div>
